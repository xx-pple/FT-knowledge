<svg xmlns="http://www.w3.org/2000/svg" width="640" height="346" viewBox="0 0 640 346" role="img" aria-label="二分查找的区间收敛过程">
  <rect width="640" height="346" fill="#f8fafc"/>

  <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b">查找 9：三次比较定位</text>
  <text x="24" y="52" font-family="sans-serif" font-size="12" fill="#64748b">虚线框是当前搜索区间，橙色是本次比较的位置</text>

  <text x="24" y="94" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">第 1 次</text>
  <rect x="94" y="64" width="488" height="56" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="98" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124" y="98" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">1</text>
  <rect x="158" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="184" y="98" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">3</text>
  <rect x="218" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="244" y="98" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">5</text>
  <rect x="278" y="70" width="52" height="44" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
  <text x="304" y="98" font-family="monospace" font-size="14" font-weight="600" fill="#9a3412" text-anchor="middle">7</text>
  <rect x="338" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="98" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">9</text>
  <rect x="398" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="424" y="98" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">11</text>
  <rect x="458" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="484" y="98" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">13</text>
  <rect x="518" y="70" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="544" y="98" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">15</text>

  <text x="94" y="140" font-family="sans-serif" font-size="11.5" fill="#64748b">mid = 3，nums[3] = 7 &lt; 9，left 移到 4</text>

  <text x="24" y="184" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">第 2 次</text>
  <rect x="334" y="154" width="248" height="56" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="338" y="160" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="364" y="188" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">9</text>
  <rect x="398" y="160" width="52" height="44" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
  <text x="424" y="188" font-family="monospace" font-size="14" font-weight="600" fill="#9a3412" text-anchor="middle">11</text>
  <rect x="458" y="160" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="484" y="188" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">13</text>
  <rect x="518" y="160" width="52" height="44" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="544" y="188" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">15</text>

  <text x="334" y="230" font-family="sans-serif" font-size="11.5" fill="#64748b">mid = 5，nums[5] = 11 &gt; 9，right 移到 4</text>

  <text x="24" y="274" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">第 3 次</text>
  <rect x="334" y="244" width="60" height="56" rx="6" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="338" y="250" width="52" height="44" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="364" y="278" font-family="monospace" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">9</text>

  <text x="334" y="320" font-family="sans-serif" font-size="11.5" fill="#15803d">mid = 4，nums[4] = 9，命中，返回 4</text>

  <text x="24" y="336" font-family="sans-serif" font-size="11" fill="#94a3b8">共比较 3 次，而线性扫描需要 5 次；数据量越大差距越明显</text>
</svg>
