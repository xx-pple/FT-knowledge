<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="闭包的作用域链示意">
  <rect width="640" height="280" fill="#f8fafc"/>

  <text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b">闭包的作用域链</text>
  <text x="24" y="54" font-family="sans-serif" font-size="12" fill="#64748b">outer 返回后，count 因被 inner 引用而无法回收</text>

  <rect x="24" y="72" width="592" height="152" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="40" y="94" font-family="sans-serif" font-size="12" font-weight="600" fill="#4338ca">outer() 的词法环境</text>

  <rect x="44" y="116" width="140" height="52" rx="6" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="114" y="138" font-family="monospace" font-size="13" fill="#1e293b" text-anchor="middle">count</text>
  <text x="114" y="156" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">值存活在堆上</text>

  <rect x="286" y="106" width="306" height="104" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="302" y="128" font-family="sans-serif" font-size="12" font-weight="600" fill="#15803d">inner() 的作用域</text>
  <text x="302" y="152" font-family="monospace" font-size="12" fill="#334155">function inner() { ... }</text>
  <text x="302" y="174" font-family="sans-serif" font-size="12" fill="#475569">作用域链上找不到 count 时，</text>
  <text x="302" y="192" font-family="sans-serif" font-size="12" fill="#475569">沿链向外层查找，而不是复制值</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M286 142 L192 142" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="239" y="132" font-family="sans-serif" font-size="11" fill="#6366f1" text-anchor="middle">引用</text>

  <text x="24" y="252" font-family="sans-serif" font-size="12" fill="#94a3b8">内存泄漏的来源：只要 inner 还可达，count 所在的作用域就不会被回收</text>
</svg>
