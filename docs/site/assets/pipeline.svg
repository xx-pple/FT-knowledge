<svg xmlns="http://www.w3.org/2000/svg" width="640" height="206" viewBox="0 0 640 206" role="img" aria-label="从 Markdown 源文件到线上页面的五步链路">
  <rect width="640" height="206" fill="#f8fafc"/>

  <text x="24" y="28" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e293b">一次发布的完整链路</text>

  <line x1="56" y1="78" x2="584" y2="78" stroke="#cbd5e1" stroke-width="1.5"/>

  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M584 78 L604 78" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#flow)"/>

  <circle cx="80" cy="78" r="8" fill="#3b82f6"/>
  <circle cx="195" cy="78" r="8" fill="#3b82f6"/>
  <circle cx="310" cy="78" r="8" fill="#3b82f6"/>
  <circle cx="425" cy="78" r="8" fill="#3b82f6"/>
  <circle cx="540" cy="78" r="8" fill="#22c55e"/>

  <text x="80" y="110" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">源文件</text>
  <text x="80" y="130" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">docs/*.md</text>
  <text x="80" y="147" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">与配图</text>

  <text x="195" y="110" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">构建</text>
  <text x="195" y="130" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">docs:build</text>
  <text x="195" y="147" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">逐页渲染</text>

  <text x="310" y="110" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">产物</text>
  <text x="310" y="130" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">纯静态 HTML</text>
  <text x="310" y="147" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">与哈希资源</text>

  <text x="425" y="110" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">部署</text>
  <text x="425" y="130" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Actions 上传</text>
  <text x="425" y="147" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">制品</text>

  <text x="540" y="110" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#15803d" text-anchor="middle">访问</text>
  <text x="540" y="130" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Pages 提供</text>
  <text x="540" y="147" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CDN 服务</text>

  <text x="24" y="184" font-family="sans-serif" font-size="11.5" fill="#94a3b8">整条链路上没有服务器运行时，也没有数据库——第 3 步之后所有内容都只是文件</text>
</svg>
