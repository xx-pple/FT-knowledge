<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="单链表结构示意">
  <rect width="640" height="200" fill="#f8fafc"/>

  <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b">单链表的结构</text>
  <text x="24" y="52" font-family="sans-serif" font-size="12" fill="#64748b">节点分散在内存各处，靠 next 指针串联</text>

  <text x="52" y="96" font-family="sans-serif" font-size="12" fill="#64748b">head</text>

  <g>
    <rect x="92" y="76" width="130" height="52" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="157" y1="76" x2="157" y2="128" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="124" y="107" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">12</text>
    <text x="189" y="107" font-family="monospace" font-size="12" fill="#0ea5e9" text-anchor="middle">next</text>
  </g>

  <g>
    <rect x="262" y="76" width="130" height="52" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="327" y1="76" x2="327" y2="128" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="294" y="107" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">7</text>
    <text x="359" y="107" font-family="monospace" font-size="12" fill="#0ea5e9" text-anchor="middle">next</text>
  </g>

  <g>
    <rect x="432" y="76" width="130" height="52" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="497" y1="76" x2="497" y2="128" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="464" y="107" font-family="monospace" font-size="14" fill="#1e293b" text-anchor="middle">3</text>
    <text x="529" y="107" font-family="monospace" font-size="12" fill="#0ea5e9" text-anchor="middle">null</text>
  </g>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M222 102 L256 102" fill="none" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#b)"/>
  <path d="M392 102 L426 102" fill="none" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#b)"/>
  <path d="M52 102 L86 102" fill="none" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#b)"/>

  <text x="92" y="152" font-family="sans-serif" font-size="11" fill="#94a3b8">地址 A</text>
  <text x="262" y="152" font-family="sans-serif" font-size="11" fill="#94a3b8">地址 C</text>
  <text x="432" y="152" font-family="sans-serif" font-size="11" fill="#94a3b8">地址 F</text>

  <text x="24" y="182" font-family="sans-serif" font-size="12" fill="#94a3b8">想取第 n 个元素，只能从头走 n 步；这也是链表不能二分的根本原因</text>
</svg>
